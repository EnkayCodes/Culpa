[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marlowe"
version = "0.1.0"
description = "A smart-contract investigator that proves every flaw it names with a working exploit"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "python-dotenv>=1.0",
    "google-genai>=0.3",
    "slither-analyzer>=0.10.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
marlowe = "marlowe.commands:app"

[tool.hatch.build.targets.wheel]
packages = ["src/marlowe"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
