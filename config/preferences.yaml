# How Culpa runs. Env vars (CULPA_*) win over these; see .env.example.

# Google Gemini model id. The free-tier limit that bites is requests-per-DAY, per model:
#   gemini-2.5-flash-lite  ~1000/day  (default)
#   gemini-2.0-flash       ~200/day   (better at code — use for the hard cases)
#   gemini-2.5-flash       ~20/day    (do not use for real runs)
model: gemini-2.5-flash-lite
max_tokens: 16000

sleuth:
  max_leads: 4
  max_proof_attempts: 2
  min_severity_to_prove: medium      # only medium/high leads get an exploit written
  demote_unproven_high: false        # if true, a high-sev finding with no landed exploit is downgraded

proof:
  timeout_s: 180
  proofground: proofground
  fuzz_seed: 424242

casework:
  root: casework

groups:
  quick: [HollowVault, OpenTill, Irongate]
  easy: [HollowVault, OpenTill]
  sound: [Irongate, LatchGate]
  hard: [HallOfMirrors]
  committed: [HollowVault, OpenTill, Irongate, LatchGate, HallOfMirrors]

# kinds of flaw where the scanner is essentially blind — reported on their own line
weak_spot_kinds: [price-oracle-manipulation, flash-loan-attack, logic-error, bad-accounting]
