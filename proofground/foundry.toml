[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./" }]
fuzz = { seed = "0x67932" }
invariant = { runs = 256, depth = 32 }

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"

# Written exploits land in test/staged/ and import through the remappings above.
